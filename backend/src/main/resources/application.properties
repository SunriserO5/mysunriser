spring.application.name=backend
spring.flyway.enabled=true
auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expireMinutes=${JWT_EXPIRE_MINUTES:120}

app.base-url=${APP_BASE_URL:http://localhost:5173}

auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}
auth.refresh-cookie.name=${AUTH_REFRESH_COOKIE_NAME:mysunriser_refresh}
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.mail.from=${AUTH_MAIL_FROM:mysunriser@163.com}

turnstile.enabled=${TURNSTILE_ENABLED:false}
turnstile.site-key=${TURNSTILE_SITE_KEY:}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

spring.mail.host=smtp.163.com
spring.mail.port=465
spring.mail.username=mysunriser@163.com
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}

media.storage-root=${MEDIA_STORAGE_ROOT:${user.home}/.mysunriser/media}
media.image-max-bytes=${MEDIA_IMAGE_MAX_BYTES:52428800}
media.attachment-max-bytes=${MEDIA_ATTACHMENT_MAX_BYTES:209715200}
spring.servlet.multipart.max-file-size=${MEDIA_ATTACHMENT_MAX_BYTES:209715200}
spring.servlet.multipart.max-request-size=${MEDIA_ATTACHMENT_MAX_BYTES:209715200}

tools.video-download.iiilab.extract-url=${IIILAB_EXTRACT_URL:https://service.iiilab.com/openapi/extract}
tools.video-download.iiilab.client-id=${IIILAB_CLIENT_ID:}
tools.video-download.iiilab.client-secret=${IIILAB_CLIENT_SECRET:}

github.token=${GITHUB_TOKEN:}
projects.readme-cache-hours=${PROJECTS_README_CACHE_HOURS:6}
